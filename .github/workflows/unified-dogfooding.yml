name: Unified Dogfooding scans
on:
  schedule:
    # Run Mon-Fri at 2 AM UTC
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: github-ubuntu-latest-s
    name: Build for Shadow Scan
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.0
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          artifactory-reader-role: private-reader    # Override default public-reader
          artifactory-deployer-role: qa-deployer     # Override default public-deployer
          run-shadow-scans: true

  run_iris:
    needs: [ build ]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    concurrency:
      group: iris
      cancel-in-progress: false
      queue: single
    runs-on: github-ubuntu-latest-s
    name: Run IRIS
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Run IRIS Analysis
        uses: SonarSource/unified-dogfooding-actions/run-iris@v1
        with:
          primary_project_key: "org.sonarsource.java:jdt-package"
          primary_platform: "Next"
          shadow1_project_key: "org.sonarsource.java:jdt-package"
          shadow1_platform: "SQC-EU"
          shadow2_project_key: "org.sonarsource.java:jdt-package"
          shadow2_platform: "SQC-US"
