name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1-5" # Run Mon-Fri at 2:15 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: github-ubuntu-latest-s  # Public repo - use custom GitHub-hosted runner
    name: Build
    permissions:
      id-token: write  # Required for Vault OIDC authentication
      contents: write  # Required for repository access and tagging
    outputs:
      build-number: ${{ steps.build-step.outputs.BUILD_NUMBER }}
      deployed: ${{ steps.build-step.outputs.deployed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.0
      - uses: SonarSource/ci-github-actions/build-maven@v2
        id: build-step
        with:
          deploy-pull-request: true
          artifactory-reader-role: private-reader    # Override default public-reader
          artifactory-deployer-role: qa-deployer     # Override default public-deployer
          sonar-platform: none
          maven-args: -Pcoverage
      - name: Upload Maven build as pipeline artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output-${{ steps.build-step.outputs.BUILD_NUMBER }}
          path: '**/target'
          retention-days: 7
          overwrite: true

  analysis:
    name: NEXT analysis
    needs: build
    # Match build-maven's should_scan policy; other refs only build and deploy.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'branch-') ||
      startsWith(github.ref_name, 'feature/long/')
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: read
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output-${{ needs.build.outputs.build-number }}
      - uses: SonarSource/ci-github-actions/build-maven@v2
        with:
          deploy: false
          skip-build: true
          sonar-platform: next
          artifactory-reader-role: private-reader

  promote:
    name: Promote
    needs:
     - build
     - analysis
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (needs.analysis.result == 'success' || needs.analysis.result == 'skipped')
      && (needs.build.outputs.deployed)
    runs-on: github-ubuntu-latest-s  # Public repo - use custom GitHub-hosted runner
    permissions:
      id-token: write  # Required for Vault OIDC authentication
      contents: write  # Required for repository access and tagging
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true

  notify-build-failure:
    name: Notify build failure
    needs:
      - build
      - analysis
      - promote
    if: >-
      always()
      && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-'))
      && contains(needs.*.result, 'failure')
    runs-on: github-ubuntu-latest-s  # Public repo - use custom GitHub-hosted runner
    permissions:
      actions: read
      id-token: write # required for vault-action-wrapper in the shared slack-notify action
    steps:
      - name: Slack Notification
        uses: SonarSource/core-languages-tooling-public/common-actions/slack-notify@v1
        with:
          slack-channel: squad-corelang-notifs
          branch-patterns: ${{ format('{0},branch-*,dogfood-*', github.event.repository.default_branch) }}
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}
